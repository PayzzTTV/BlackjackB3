name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "27 6 * * 1" # chaque lundi : détecte aussi les nouvelles règles sur du code inchangé

permissions:
  contents: read

jobs:
  analyse:
    # Le code scanning est gratuit sur un dépôt public. Sur un dépôt privé il faut
    # GitHub Code Security (payant) : on saute le job au lieu d'échouer.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL ne reconnaît pas l'extension .gs : on expose une copie .js du back Apps Script
      # (non commitée) pour qu'il soit analysé comme le front.
      - name: Exposer le code Apps Script à CodeQL
        run: |
          mkdir -p codeql-gs
          for f in backend/*.gs; do cp "$f" "codeql-gs/$(basename "$f" .gs).js"; done
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
