name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions épinglées par SHA de commit (un tag peut être déplacé, pas un SHA).
# Dependabot met à jour le SHA et le commentaire de version.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"
