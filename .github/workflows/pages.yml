name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : seulement ce qu'exige le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # L'URL de l'API vient du secret BJ_API_URL : elle n'est jamais commitée.
      # Passée par variable d'environnement (pas d'interpolation ${{ }} dans le script : anti-injection),
      # et validée strictement avant d'être écrite dans config.js.
      - name: Injecter la configuration depuis les secrets
        env:
          BJ_API_URL: ${{ secrets.BJ_API_URL }}
        run: bash scripts/injecter-config.sh frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploiement
        uses: actions/deploy-pages@v4
