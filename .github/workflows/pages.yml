name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : seulement ce qu'exige le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Actions épinglées par SHA de commit (un tag peut être déplacé, pas un SHA).
# Dependabot met à jour le SHA et le commentaire de version.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # L'URL de l'API vient du secret BJ_API_URL : elle n'est jamais commitée.
      # Passée par variable d'environnement (pas d'interpolation ${{ }} dans le script : anti-injection),
      # et validée strictement avant d'être écrite dans config.js.
      - name: Injecter la configuration depuis les secrets
        env:
          BJ_API_URL: ${{ secrets.BJ_API_URL }}
        run: bash scripts/injecter-config.sh frontend/config.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
